trigger:
  branches:
    include:
      - main
      - dev

pool: 'default'

variables:
  - name: imageName
    value: 'pipeline-sandbox'
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
      - name: environment
        value: 'production'
      - name: imageTag
        value: 'prod-$(Build.BuildId)'
      - name: deployTarget
        value: 'prod-app-service'
      - name: packageVersion
        value: '1.0.$(Build.BuildId)'
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/dev') }}:
      - name: environment
        value: 'development'
      - name: imageTag
        value: 'dev-$(Build.BuildId)'
      - name: deployTarget
        value: 'dev-app-service'
      - name: packageVersion
        value: '1.0.$(Build.BuildId)-dev.$(Build.BuildId)'

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Install, Build, Test'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js'

          - task: npm@1
            inputs:
              command: 'ci'
            displayName: 'npm install'

          - task: npm@1
            inputs:
              command: 'custom'
              customCommand: 'test'
            displayName: 'Run unit tests'

  - stage: Publish
    displayName: 'Publish to Azure Artifacts'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: PublishPackage
        displayName: 'Publish npm package'
        steps:
          - task: Npm@1
            inputs:
              command: 'publish'
              publishRegistry: 'useFeed'
              publishFeed: 'ed84720b-777f-4a5b-8f90-a0b0d81c6d4b/3f29ac59-9f51-4020-a5ad-1a62b89c6193'
            displayName: 'Publish package to feed'

  - stage: Docker
    displayName: 'Build and Push to ECR'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DockerBuildPush
        displayName: 'Build image and push to ECR'
        steps:
          - task: Docker@2
            inputs:
              containerRegistry: 'ecr-registry'
              command: 'buildAndPush'
              Dockerfile: '**/Dockerfile'
              buildContext: '.'
            displayName: 'Build and push image to ECR'
